<!-- Documentation component. Not loaded at runtime: the real markup is repeated inside every page (see README.md, "Component architecture"). -->
<div id="delete-user-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-user-title" aria-describedby="delete-user-desc" tabindex="-1" hidden>
  <header class="modal-header">
    <h2 id="delete-user-title">Delete user?</h2>
    <button type="button" class="modal-close" data-modal-close aria-label="Close dialog"><span aria-hidden="true">&times;</span></button>
  </header>
  <p id="delete-user-desc">You are about to permanently delete the account of <strong data-delete-name>this user</strong>. They will lose all access. This is a demonstration, so nothing is stored, but a real system would not allow this to be undone.</p>
  <div class="modal-actions">
    <button type="button" class="btn btn-danger" data-confirm-delete>Delete user</button>
    <button type="button" class="btn" data-modal-close data-autofocus>Cancel, keep user</button>
  </div>
</div>
